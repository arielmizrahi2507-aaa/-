<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140b2e">
<meta name="description" content="מכות בכנסת: משחק לחימה סאטירי עם חברי כנסת קריקטוריים, יכולת מיוחדת ומכות ייחודיות לכל אחד.">
<title>מכות בכנסת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Secular+One&display=swap" rel="stylesheet">
<style>:root {
  --u-vw: 1vw; --u-vh: 1vh; --lw: 100vw; --lh: 100vh; --vpw: 100vw; --vph: 100vh;
  --bg: #140b2e; --line: #0d0720; --ink: #fff; --muted: #c2b5e6; --gold: #ffd23d; --pink: #ff4f8b; --cyan: #4ff0ff;
  --f-ui: 'Rubik', 'Heebo', 'Assistant', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --f-disp: 'Secular One', 'Rubik', 'Heebo', 'Arial Hebrew', Impact, Arial, sans-serif;
  --ca: #2155e0; --cb: #e23b52;
  --tb: clamp(58px, 15vmin, 96px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0d0720; color: var(--ink); font-family: var(--f-ui); overflow: hidden; overscroll-behavior: none; font-size: clamp(13px, 1.9vmin + 4px, 22px); }
button, input, select { font-family: inherit; }
html, body { touch-action: manipulation; }
#app { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #3d1c85 0%, #140b2e 68%); }
/* landscape mode: the whole app is turned 90 degrees for a phone that stays in portrait (see Game.layout) */
body.rot #app { inset: auto; left: 0; top: 0; width: var(--lw); height: var(--lh); transform-origin: 0 0; }
body.rot-cw #app { transform: translateX(var(--vpw)) rotate(90deg); }
body.rot-ccw #app { transform: translateY(var(--vph)) rotate(-90deg); }
#view { position: absolute; display: none; }
body[data-view=attract] #view, body[data-view=fight] #view { display: block; }
#cv { width: 100%; height: 100%; display: block; }

/* ------------------------------------------------------------ screens */
#screens { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; pointer-events: auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.screen.on { display: flex; animation: scr .28s ease-out; }
@keyframes scr { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
#s-select, #s-settings, #s-help, #s-achv {
  background: linear-gradient(160deg, #1d1048 0%, #0f0828 62%), repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 26px, transparent 26px 52px);
  background-blend-mode: normal;
}
#s-select::before, #s-settings::before, #s-help::before, #s-achv::before { content: ''; position: fixed; inset: 0; z-index: -1; background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 26px, transparent 26px 52px); pointer-events: none; }
#s-pause, #s-result, #s-bills, #s-daily { background: rgba(8, 4, 24, .78); justify-content: center; align-items: center; padding: 3vmin; }
#s-title { background: linear-gradient(90deg, rgba(20,11,46,.05) 0%, rgba(20,11,46,.55) 55%, rgba(20,11,46,.86) 100%); }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.6vmin 3vmin; flex: none; }
.screen > .bar:first-child { position: sticky; top: 0; z-index: 6; background: linear-gradient(#170b3d 72%, rgba(23,11,61,0)); }
.bar .ttl { text-align: center; flex: 1; }
.bar h2 { margin: 0; font: 400 clamp(22px, 4.2vmin, 40px)/1.1 var(--f-disp); text-shadow: 0 3px 0 var(--line); }
.bar small { color: var(--muted); font-weight: 500; }
.extra { min-width: 90px; display: flex; justify-content: flex-end; }
.foot-bar { justify-content: center; position: sticky; bottom: 0; background: linear-gradient(rgba(15,8,40,0), #0f0828 45%); padding-top: 3vmin; z-index: 5; }

/* ------------------------------------------------------------ buttons */
.btn {
  position: relative; appearance: none; border: 3px solid var(--line); background: linear-gradient(#5a37b8, #3a2380); color: #fff;
  font: 700 clamp(14px, 2.1vmin + 2px, 21px)/1.15 var(--f-ui); padding: .65em 1.15em; border-radius: 14px; cursor: pointer;
  box-shadow: 0 5px 0 var(--line), inset 0 2px 0 rgba(255,255,255,.2); transition: transform .08s, filter .15s; text-align: center;
}
.btn:hover, .btn:focus-visible { filter: brightness(1.16); transform: translateY(-2px); }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn.primary { background: linear-gradient(#ffe36a, #ffb800); color: #2b1400; border-color: #4d2a00; }
.btn.pink { background: linear-gradient(#ff80ad, #e21a63); }
.btn.cyan { background: linear-gradient(#78f4ff, #1aa3d6); color: #00222e; }
.btn.ghost { background: rgba(255,255,255,.08); }
.btn.danger { background: linear-gradient(#b02a48, #781430); }
.btn.big { padding: .7em 1.3em; }
.btn svg { width: 1.05em; height: 1.05em; fill: currentColor; vertical-align: -.14em; margin-inline-end: .45em; }
.btn b { font: 400 1.32em/1.1 var(--f-disp); display: block; }
.btn small { display: block; font-weight: 500; opacity: .85; font-size: .7em; margin-top: .3em; }
.btn[disabled] { opacity: .6; filter: grayscale(.7); cursor: not-allowed; transform: none; }
.iconbtn { position: fixed; z-index: 30; top: 10px; left: 10px; width: 42px; height: 42px; border-radius: 12px; border: 3px solid var(--line); background: rgba(40,20,90,.85); color: #fff; padding: 8px; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.iconbtn svg { width: 100%; height: 100%; fill: currentColor; }
body[data-view=fight] #mute { display: none; }
body[data-screen=select] #mute, body[data-screen=settings] #mute, body[data-screen=help] #mute, body[data-screen=achv] #mute { top: auto; bottom: 12px; }
body[data-screen=vs] #mute { display: none; }

/* ------------------------------------------------------------ title */
.title-wrap { flex: 1; display: grid; grid-template-columns: 1fr minmax(320px, 46%); align-items: center; gap: 2vmin 4vmin; padding: 3vmin 6vmin; min-height: 0; }
.logo { text-align: center; }
.logo .l1, .logo .l2 { font: 400 clamp(64px, 17vmin, 200px)/.86 var(--f-disp); -webkit-text-stroke: clamp(6px, 1.4vmin, 14px) #12061f; paint-order: stroke fill; letter-spacing: .01em; }
.logo .l1 { color: var(--gold); transform: rotate(-4deg); text-shadow: 0 .07em 0 #b02a00, 0 .13em 0 #12061f; animation: bob 3.2s ease-in-out infinite; }
.logo .l2 { color: #fff; transform: rotate(-2deg) translateX(-2vmin); text-shadow: 0 .07em 0 #ff2a78, 0 .13em 0 #12061f; animation: bob 3.2s ease-in-out .5s infinite; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -1.2vmin; } }
.logo .l3 { margin-top: 2.2vmin; font: 700 clamp(12px, 2.4vmin, 24px) var(--f-ui); letter-spacing: .5em; color: var(--cyan); text-shadow: 0 2px 0 var(--line); direction: ltr; }
.logo .tag { margin: 1vmin 0 0; color: var(--muted); font-weight: 500; }
.menu { display: flex; flex-direction: column; gap: 1.5vmin; width: 100%; max-width: 560px; justify-self: center; }
.menu .btn.big { display: block; width: 100%; }
.menu-row { display: flex; flex-wrap: wrap; gap: 1vmin; }
.menu-row .btn { flex: 1 1 28%; font-size: .82em; padding: .6em .4em; }
.rotbox { display: none; gap: 1vmin; flex-wrap: wrap; }
body.touchdev.phys-portrait .rotbox { display: flex; }
.rotbox .btn { flex: 1 1 40%; }
.rotbox #rot-on { flex-basis: 100%; }
.rotbox #rot-flip, .rotbox #rot-off { display: none; font-size: .82em; }
body.rot .rotbox #rot-flip, body.rot .rotbox #rot-off { display: block; }
body.rot .rotbox #rot-on { display: none; }
.row.touchonly, .row.fsonly { display: none; }
body.touchdev .row.touchonly { display: flex; }
body.canfs .row.fsonly { display: flex; }
.foot { flex: none; display: flex; justify-content: space-between; gap: 2rem; padding: 1.2vmin 4vmin; font-size: .72rem; color: var(--muted); background: rgba(0,0,0,.35); align-items: center; }
.foot .disc { max-width: 60%; text-align: left; opacity: .85; }

/* ------------------------------------------------------------ character select */
.selbody { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2vmin; padding: 0 3vmin 1vmin; min-height: 0; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.1vmin; align-content: start; overflow-y: auto; padding: 6px; }
.card {
  --pc: #888; position: relative; appearance: none; border: 4px solid var(--line); border-radius: 18px; cursor: pointer; color: #fff; padding: .5rem .3rem .45rem;
  background: #2a1a5a; background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 55%, #1a0e40) 0%, #1a0e40 100%); box-shadow: 0 5px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; gap: .15rem; transition: transform .1s, filter .15s;
}
.card img { width: 100%; max-width: 110px; aspect-ratio: 1; }
.card b { font: 400 1.05em/1.1 var(--f-disp); text-shadow: 0 2px 0 var(--line); }
.card span { font-size: .68em; font-weight: 700; padding: .1em .6em; border-radius: 999px; background: var(--pc); color: #111; border: 2px solid var(--line); }
.card:hover, .card:focus-visible { transform: translateY(-3px); filter: brightness(1.12); outline: none; }
.card.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 0 30px var(--pc), 0 5px 0 var(--line); transform: translateY(-3px) scale(1.03); z-index: 2; }
.card.locked { filter: grayscale(1) brightness(.6); }
.card.locked.sel { filter: grayscale(.8) brightness(.8); }
.detail { overflow-y: auto; background: rgba(20, 10, 50, .78); border: 3px solid var(--line); border-radius: 18px; padding: 1.2vmin; box-shadow: 0 6px 0 var(--line); min-height: 0; }
.pvwrap { position: relative; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9; max-height: calc(34 * var(--u-vh)); margin-inline: auto; }
#pv { width: 100%; height: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
.pvcap { position: absolute; inset-inline: 0; bottom: 0; padding: .7em 1em .4em; background: linear-gradient(transparent, rgba(0,0,0,.85)); font: 400 1.05em var(--f-disp); text-align: center; min-height: 2.6em; }
.dwrap { --pc: #888; }
.dhead { display: flex; align-items: center; gap: .8rem; margin: .8rem 0 .3rem; }
.dhead img { width: 72px; height: 72px; flex: none; }
.dhead h3 { margin: 0 0 .2rem; font: 400 1.7em/1.1 var(--f-disp); }
.arch { color: var(--muted); font-weight: 700; margin-inline-start: .4rem; }
.party { display: inline-block; background: var(--pc, #666); color: #10061f; font-weight: 800; font-size: .78em; padding: .1em .7em; border-radius: 999px; border: 2px solid var(--line); }
.blurb { margin: .3rem 0 .8rem; color: #e6defa; line-height: 1.45; }
.lockmsg { color: #ff9ab4; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3rem; margin-bottom: .8rem; }
.stats div { display: flex; flex-direction: column; align-items: center; gap: .15rem; font-size: .78em; color: var(--muted); font-weight: 700; }
.pips { display: flex; gap: 2px; }
.pips i { width: .7em; height: 1em; border-radius: 3px; background: rgba(255,255,255,.14); border: 1.5px solid var(--line); }
.pips i.on { background: linear-gradient(var(--gold), #ff9a1f); }
.passive { border-inline-start: 6px solid var(--pc); background: rgba(255,255,255,.08); padding: .6rem .9rem; border-radius: 6px 12px 12px 6px; margin-bottom: .8rem; }
.passive h4, .normals h4 { margin: 0 0 .25rem; font: 400 1.05em var(--f-disp); color: var(--gold); }
.passive p { margin: 0; line-height: 1.4; }
.mv { display: flex; gap: .7rem; align-items: flex-start; padding: .5rem .6rem; border-radius: 12px; background: rgba(255,255,255,.07); margin-bottom: .4rem; }
.mv img { width: 46px; height: 46px; flex: none; background: rgba(0,0,0,.3); border-radius: 10px; }
.mv em { font-style: normal; color: var(--gold); font-size: .8em; font-weight: 800; margin-inline-end: .3rem; }
.mv b { font-size: .98em; }
.mv p { margin: .15rem 0 0; font-size: .86em; color: #e0d8f5; line-height: 1.35; }
.cdc { font-size: .72em; color: var(--cyan); margin-inline-start: .4rem; font-weight: 700; }
.mv.sup { background: linear-gradient(90deg, rgba(255,210,61,.2), rgba(255,210,61,.04)); border: 1.5px solid rgba(255,210,61,.55); }
.normals { margin-top: .6rem; }
.normals ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .25rem .8rem; font-size: .84em; }
.normals li em { font-style: normal; color: var(--muted); font-size: .85em; display: block; }
.seg { display: inline-flex; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 var(--line); align-items: center; }
.seg button { border: 0; background: #33206f; color: #fff; padding: .55em .9em; font-weight: 800; cursor: pointer; font-size: .9em; }
.seg button.on { background: linear-gradient(#ffe36a, #ffb800); color: #2b1400; }
.seg button:focus-visible { outline: 3px solid var(--cyan); outline-offset: -3px; }
.seg.stg b { padding: 0 .8em; font-size: .85em; min-width: 8em; text-align: center; }

/* ------------------------------------------------------------ versus splash */
#s-vs { background: radial-gradient(circle at 50% 50%, #2e1470 0%, #0d0720 78%); justify-content: center; align-items: center; cursor: pointer; overflow: hidden; }
.vs-wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; padding: 0 4vmin; gap: 2vmin; }
.vs-side { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-align: center; }
.vs-side canvas { width: min(calc(34 * var(--u-vw)), calc(42 * var(--u-vh))); height: auto; aspect-ratio: 1; filter: drop-shadow(0 10px 0 rgba(0,0,0,.5)); }
.vs-side h3 { margin: 0; font: 400 clamp(20px, 4.4vmin, 44px) var(--f-disp); text-shadow: 0 3px 0 var(--line); }
.vs-side q { max-width: 26ch; color: #fff3b0; font-weight: 700; quotes: none; min-height: 2.8em; }
.vs-side.l { animation: inL .55s cubic-bezier(.2,.9,.3,1.2); }
.vs-side.r { animation: inR .55s cubic-bezier(.2,.9,.3,1.2); }
@keyframes inL { from { transform: translateX(calc(-90 * var(--u-vw))); } }
@keyframes inR { from { transform: translateX(calc(90 * var(--u-vw))); } }
.vs-burst { font: 400 clamp(56px, 15vmin, 170px) var(--f-disp); color: var(--gold); -webkit-text-stroke: clamp(5px, 1.2vmin, 12px) #12061f; paint-order: stroke fill; text-shadow: 0 .08em 0 #b02a00; animation: pop .7s cubic-bezier(.2,1.6,.4,1) .3s backwards; direction: ltr; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } }
.vs-foot { position: absolute; bottom: 4vmin; inset-inline: 0; text-align: center; }
.vs-foot b { font: 400 clamp(18px, 3.6vmin, 34px) var(--f-disp); display: block; text-shadow: 0 3px 0 var(--line); }
.vs-foot span { color: var(--muted); }
.vs-skip { display: block; margin-top: .5rem; font-style: normal; font-size: .82em; color: var(--muted); opacity: .8; }
.vs-cancel { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); inset-inline-end: 12px; z-index: 3; }

/* ------------------------------------------------------------ cards / results */
.res-card { background: linear-gradient(#2c186c, #170c3c); border: 4px solid var(--line); border-radius: 24px; box-shadow: 0 10px 0 var(--line), 0 0 70px rgba(130, 90, 255, .35); padding: 3vmin 4vmin; width: 100%; max-width: min(calc(94 * var(--u-vw)), 720px); text-align: center; max-height: calc(94 * var(--u-vh)); overflow-y: auto; }
.res-card.wide-card { max-width: min(calc(96 * var(--u-vw)), 940px); }
.res-card h2 { margin: 0 0 1vmin; font: 400 clamp(24px, 5vmin, 46px) var(--f-disp); text-shadow: 0 3px 0 var(--line); }
.stack { display: flex; flex-direction: column; gap: 1.2vmin; margin-top: 2vmin; align-items: stretch; }
.winbox { display: flex; gap: 1.6rem; align-items: center; justify-content: center; margin-bottom: 1.4vmin; border-inline-start: 8px solid var(--pc); padding: .4rem 1rem; text-align: start; }
.winbox img { width: clamp(84px, 16vmin, 140px); flex: none; }
.winbox small { color: var(--gold); font-weight: 800; }
.winbox h2 { margin: .1em 0; }
.winbox p { margin: .3em 0 0; font-weight: 700; color: #fff3b0; }
.rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin: 1.2vmin 0; }
.rstats div, .sgrid div { background: rgba(255,255,255,.08); border-radius: 12px; padding: .5rem .2rem; display: flex; flex-direction: column; }
.rstats b, .sgrid b { font: 400 1.8em var(--f-disp); color: var(--gold); }
.rstats span, .sgrid span { font-size: .75em; color: var(--muted); font-weight: 700; }
.ladder { display: flex; gap: .5rem; justify-content: center; margin: 1.6vmin 0; flex-wrap: wrap; }
.ladder div { position: relative; width: clamp(44px, 8vmin, 70px); opacity: .55; }
.ladder img { width: 100%; }
.ladder span { position: absolute; bottom: -4px; inset-inline-start: -4px; background: var(--line); border-radius: 50%; width: 1.5em; height: 1.5em; display: grid; place-items: center; font-size: .75em; font-weight: 800; }
.ladder .done { opacity: 1; filter: saturate(.8); }
.ladder .done::after { content: '✓'; position: absolute; top: 0; inset-inline-end: 0; background: #2ecc71; color: #062; width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center; font-weight: 900; border: 2px solid var(--line); font-size: .8em; }
.ladder .cur { opacity: 1; outline: 4px solid var(--gold); border-radius: 50%; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.next { color: var(--muted); font-weight: 700; margin: .6rem 0; }
.next b { color: #fff; }
.ending img { width: clamp(100px, 22vmin, 180px); }
.ending h2 { margin-top: .4rem; }
.endtxt { line-height: 1.5; color: #e9e0ff; margin: .6rem auto; max-width: 46ch; }
.ending small { color: var(--cyan); font-weight: 700; }
.ending.bad img { filter: grayscale(.6); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-top: 1vmin; }
.chips span { background: rgba(255,255,255,.1); border-radius: 999px; padding: .25em .8em; font-size: .78em; font-weight: 700; }
.bills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vmin; margin-top: 2vmin; }
.bill { --pc: #fff; appearance: none; cursor: pointer; color: #fff; text-align: center; border: 4px solid var(--line); border-radius: 18px; padding: 1rem .6rem; background: linear-gradient(#3b2390, #23134f); box-shadow: 0 6px 0 var(--line); display: flex; flex-direction: column; gap: .5rem; align-items: center; transition: transform .1s, filter .15s; }
.bill:hover, .bill:focus-visible { transform: translateY(-5px); filter: brightness(1.15); outline: 3px solid var(--pc); }
.bill img { width: 56px; height: 56px; background: rgba(0,0,0,.3); border-radius: 12px; border: 2px solid var(--pc); }
.bill b { font: 400 1.2em var(--f-disp); }
.bill span { font-size: .84em; color: #e2d9f7; line-height: 1.35; }
.dk { color: var(--muted); }
.dmut { background: linear-gradient(90deg, rgba(79,240,255,.2), rgba(255,79,139,.2)); border: 2px solid var(--cyan); border-radius: 14px; padding: .7rem 1rem; margin: 1vmin 0; display: flex; flex-direction: column; gap: .2rem; }
.dmut b { font: 400 1.25em var(--f-disp); color: var(--cyan); }
.dline { display: flex; align-items: center; justify-content: center; gap: 1.4rem; margin: 1.5vmin 0; }
.dside { display: flex; flex-direction: column; align-items: center; }
.dside img { width: 90px; }
.dfoes { display: flex; gap: .5rem; }
.dfoes img { width: 64px; }
.darrow { font-size: 1.6em; color: var(--gold); }
.okmsg { color: #7dff9a; font-weight: 800; margin: 0; }
.movecard { text-align: start; max-height: calc(70 * var(--u-vh)); overflow-y: auto; }
.pause-card { max-width: min(calc(92 * var(--u-vw)), 520px); }
.pause-card .pmode { margin: -.3rem 0 .2rem; color: var(--cyan); font-weight: 800; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vmin; }
.keyhint { color: var(--muted); font-size: .78em; margin: 1.2vmin 0 0; }
@media (hover: none) { .keyhint { display: none; } }

/* ------------------------------------------------------------ panels */
.panel { margin: 0 auto; padding: 1vmin 3vmin 4vmin; width: 100%; max-width: 620px; }
.panel.wide { max-width: 1040px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem .6rem; border-bottom: 1px solid rgba(255,255,255,.14); font-weight: 700; gap: 1rem; }
.row input[type=range] { width: 50%; accent-color: var(--gold); }
.row input[type=checkbox] { width: 1.6em; height: 1.6em; accent-color: var(--gold); }
.row select { background: #2f1b66; color: #fff; border: 3px solid var(--line); border-radius: 10px; padding: .4em .7em; font-weight: 700; }
.help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin; }
.help h3 { font: 400 1.3em var(--f-disp); color: var(--gold); margin: 1rem 0 .4rem; }
.help table { width: 100%; border-collapse: collapse; }

/* ---- 00-util.js ---- */
// ===== Core constants =====

// Draw an entity/icon kind at a position (used by HUD and move list, and by the battle renderer).
function drawEnt(ctx, kind, x, y, e = {}) {
  const fn = ENT[kind];
  if (!fn) return;
  ctx.save();
  ctx.translate(x, y);
  if (e.dir < 0) ctx.scale(-1, 1);
  if (e.sc) ctx.scale(e.sc, e.sc);
  if (e.rot) ctx.rotate(e.rot);

function drawProp(ctx, kind, x, y, ang, sc = 1) {
  const fn = PROP[kind] || ENT[kind];

  ctx.rotate(ang);
  ctx.scale(sc, sc);
  fn(ctx, { t: 0 });

// ===== Fighter poses =====
// `poseOf` turns a Fighter's state into joint targets for a small 2-bone IK skeleton (hips, torso lean, head, hands, feet).
// The drawing lives in 21-fighter-render.js.

const SKIN = { fair: '#f6cfa8', tan: '#e2a877', olive: '#d9a06b', brown: '#b9825a' };

// ---- Attack pose table -------------------------------------------------------------------------------------
// Each entry describes which limb moves and where it goes at full extension (e=1). Coordinates are local
// (feet origin, +x forward, -y up). `from` is the wind-up position (e<0 blends toward it).
const ATK = {
  jab:     { limb: 'handF', to: [88, -132], from: [6, -118], lean: 0.10, hip: 4 },
  cross:   { limb: 'handB', to: [92, -128], from: [-10, -112], lean: 0.24, hip: 10, twist: 1 },
  hook:    { limb: 'handF', arc: [2.5, 0.1, 58], lean: 0.2, hip: 6 },
  uppercut:{ limb: 'handF', to: [46, -204], from: [30, -74], lean: -0.08, hip: 0, rise: 12 },
  kick:    { limb: 'footF', to: [86, -92], from: [-10, -18], lean: -0.16, hip: 0, guard: true },
  lowkick: { limb: 'footF', to: [92, -22], from: [-12, -10], lean: 0.05, crouch: 0.5, guard: true },
  highkick:{ limb: 'footF', to: [66, -150], from: [0, -30], lean: -0.32, hip: 0, guard: true },
  slam:    { limb: 'both', to: [70, -66], from: [12, -214], lean: 0.32, hip: 8 },
  chop:    { limb: 'handF', arc: [-2.2, 0.55, 60], lean: 0.26, hip: 8 },
  shove:   { limb: 'both', to: [84, -122], from: [10, -116], lean: 0.32, hip: 8 },
  swing:   { limb: 'handF', arc: [-2.5, 0.6, 62], lean: 0.24, hip: 6, prop: true },
  point:   { limb: 'handF', to: [96, -134], from: [24, -150], lean: 0.12, hip: 4, finger: true },
  airpunch:{ limb: 'handF', to: [84, -110], from: [16, -120], lean: 0.2, air: true },
  airkick: { limb: 'footF', to: [76, -46], from: [10, -50], lean: -0.1, air: true },
  dash:    { limb: 'dash' },
  cast:    { limb: 'cast' },
  summon:  { limb: 'summon' },
  buff:    { limb: 'buff' },
  spin:    { limb: 'spin' },
  ground:  { limb: 'ground' },
  throw:   { limb: 'throw' },

function easeE(mv, mt) {
  // extension scalar: -0.35 (wind-up) .. 1 (full) .. back to 0
  // scripted specials only give `frames` / `release`; derive a wind-up, a short active window and a recovery from them
  const total = mv.frames || 30;
  const s = mv.startup !== undefined ? mv.startup : (mv.release !== undefined ? mv.release : Math.floor(total * 0.35));
  const a = mv.active !== undefined ? mv.active : 4;
  const r = mv.recovery !== undefined ? mv.recovery : Math.max(6, total - s - a);
  if (mt < s) {
    const u = mt / Math.max(1, s);
    if (u < 0.65) return -0.35 * Ease.smooth(u / 0.65);
    return lerp(-0.35, 1, Ease.outQuad((u - 0.65) / 0.35));
  }
  if (mt < s + a) return 1;
  const q = (mt - s - a) / Math.max(1, r);
  return 1 - Ease.outCubic(clamp(q, 0, 1));

const REST = {
  handF: [34, -124], handB: [14, -116], footF: [24, 0], footB: [-22, 0],
};

function newPose() {
  return {
    hx: 0, hy: -71, lean: 0, headX: 0, headY: 0, headRot: 0, rot: 0, rotX: 0, rotY: -60,
    handF: REST.handF.slice(), handB: REST.handB.slice(), footF: REST.footF.slice(), footB: REST.footB.slice(),
    sx: 1, sy: 1, eyes: 'open', mouth: 'closed', prop: null, propAng: 0, glow: null, dizzy: false, finger: false,
    fistF: true,
  };
}

function poseOf(f) {
  const p = newPose();
  const clock = f.clock || 0;
  const st = f.st;
  const mv = f.mv;
  const bob = Math.sin(clock * 0.09);

  const setGuard = (k = 1) => {
    p.handF = [lerp(34, 38, k), -124 + bob * 2];
    p.handB = [14, -116 + bob * 1.5];
  };

  if (st === 'idle' || st === 'intro' || st === 'walk' || st === 'dash' || st === 'blockstun' || st === 'block') {
    p.hy = -71 + bob * 1.6;
    p.sy = 1 + bob * 0.008; p.sx = 1 - bob * 0.006;
    setGuard();
    if (st === 'walk' || st === 'dash') {
      const ph = f.walkPh;
      const dirF = f.moveDir === f.face ? 1 : -1;
      const sw = Math.sin(ph) * 26 * dirF, lift = Math.max(0, Math.cos(ph)) * 12, lift2 = Math.max(0, -Math.cos(ph)) * 12;
      p.footF = [22 + sw, -lift]; p.footB = [-20 - sw, -lift2];
      p.hy += Math.abs(Math.sin(ph)) * -3;
      p.lean = 0.06 * dirF;
      p.handF = [30 - sw * 0.25, -122]; p.handB = [16 + sw * 0.25, -114];
      if (st === 'dash') {
        const dd = dirF > 0 ? 1 : -1;
        p.lean = 0.5 * dd; p.footF = [50 * dd + 4, -8]; p.footB = [-40 * dd, -4];
        p.handF = [-8, -108]; p.handB = [-20, -96]; p.hy = -60;

      const cr = f.crouchBlock ? 1 : 0;
      p.handF = [42, -136 + cr * 34]; p.handB = [36, -128 + cr * 34];
      p.eyes = 'squint'; p.lean = -0.06;

    p.handF = [44, up ? -166 : -136]; p.handB = [-8, up ? -150 : -128];
    p.lean = up ? 0.06 : -0.04;
    p.mouth = 'open';
    p.sy = up ? 1.05 : 0.97; p.sx = up ? 0.96 : 1.03;

    p.handF = [6, -100]; p.handB = [-24, -110];
    p.hx = -4 - k * 6;
    p.eyes = 'hurt'; p.mouth = 'shout';
    p.footF = [22, 0]; p.footB = [-26, 0];
    if (st === 'airhit') {
      p.rot = -0.9 - (f.vy > 0 ? 0.3 : 0); p.rotY = -90; p.footF = [10, -50]; p.footB = [-6, -26];
      p.handF = [40, -150]; p.handB = [-30, -150]; p.hy = -80;
    }
    if (f.crouchHit) { p.hy = -40; p.headY = 22; p.footF = [40, 0]; p.footB = [-32, 0]; }

    p.hy = -44; p.eyes = st === 'ko' ? 'ko' : 'hurt'; p.mouth = st === 'ko' ? 'sad' : 'shout';
    p.handF = [50, -80]; p.handB = [-30, -100];
    p.footF = [24, -8]; p.footB = [-16, -4];
    p.dizzy = st === 'down' && t > 8 && t < 60;

  } else if (st === 'thrown') {
    p.rot = -1.4 + (f.thrownSpin || 0); p.rotY = -70; p.hy = -60; p.eyes = 'hurt'; p.mouth = 'shout';
    p.handF = [40, -150]; p.handB = [-30, -150]; p.footF = [20, -30]; p.footB = [-20, -40];
  } else if (st === 'stun') {

    p.eyes = 'ko'; p.mouth = 'o'; p.dizzy = true; p.handF = [10, -90]; p.handB = [-10, -86];
  } else if (st === 'win') {
    const t = f.t;
    p.hy = -71 - Math.abs(Math.sin(t * 0.14)) * 8;

    p.hy = -71; p.handF = [40, -190]; p.handB = [-4, -120]; p.eyes = 'happy'; p.mouth = 'grin'; p.lean = -0.1 + Math.sin(f.t * 0.4) * 0.05;
  } else if (st === 'attack' && mv) {

    const u = f.t;
    p.mouth = 'shout'; p.eyes = 'angry';
    if (u < 8) { p.lean = 0.3; p.handF = [64, -100]; p.handB = [56, -96]; }
    else if (u < 26) { p.lean = -0.2; p.handF = [40, -200]; p.handB = [30, -196]; p.hy = -70; }
    else { p.lean = 0.42; p.handF = [70, -60]; p.handB = [60, -56]; p.hy = -60; }

  else if (p.eyes === 'open' && ((f.clock || 0) + (f.def.look.h || 1) * 97) % 230 < 6) p.eyes = 'blink';
  return p;
}

function applyAttackPose(f, p, mv) {
  const spec = ATK[mv.anim] || ATK.jab;
  const mt = f.mt;
  const air = mv.air || spec.air;
  p.mouth = 'shout'; p.eyes = 'angry';
  const SCRIPTED = ['cast', 'summon', 'buff', 'dash', 'spin', 'ground', 'throw'];
  if (!SCRIPTED.includes(spec.limb)) {
    const e = easeE(mv, mt);
    const ex = clamp(e, -0.4, 1.05);
    let target;
    if (spec.arc) {
      const [a0, a1, r] = spec.arc;
      const ang = lerp(a0, a1, clamp((e + 0.35) / 1.35, 0, 1));
      const sx = 14 + p.hx, sy = p.hy - 50;
      target = [sx + Math.cos(ang) * r, sy - Math.sin(ang) * r * 1.0];
    } else {
      const from = spec.from, to = spec.to;
      const u = ex < 0 ? ex / -0.35 : ex; // wind-up toward `from`
      target = ex < 0
        ? [lerp(REST[spec.limb === 'footF' ? 'footF' : 'handF'][0], from[0], u), lerp(REST[spec.limb === 'footF' ? 'footF' : 'handF'][1], from[1], u)]
        : [lerp(REST[spec.limb === 'footF' ? 'footF' : (spec.limb === 'handB' ? 'handB' : 'handF')][0], to[0], ex),
           lerp(REST[spec.limb === 'footF' ? 'footF' : (spec.limb === 'handB' ? 'handB' : 'handF')][1], to[1], ex)];
    }
    p.lean = (spec.lean || 0) * ex;
    p.hx = (spec.hip || 0) * ex;
    if (spec.twist) p.headRot = 0.1 * ex;
    if (spec.crouch) { p.hy = -71 + 39 * spec.crouch * clamp(ex + 0.35, 0, 1); p.footB = [-30, 0]; }
    if (spec.rise) p.hy = -71 - spec.rise * ex;
    if (mv.crouch) { p.hy = -40; p.headY = 22; p.footB = [-32, 0]; p.handB = [22, -92]; p.handF = [40, -100]; }

    if (spec.limb === 'handF') { p.handF = target; p.handB = [10, -112]; }
    else if (spec.limb === 'handB') { p.handB = target; p.handF = [34, -124]; }
    else if (spec.limb === 'footF') {
      p.footF = target;
      if (spec.guard) { p.handF = [40, -128]; p.handB = [16, -118]; }
      p.footB = [-20, 0];
      if (air) { p.footB = [-14, -30]; p.footF = target; }
    } else if (spec.limb === 'both') {
      const bt = [target[0], target[1]];
      p.handF = bt; p.handB = [bt[0] - 12, bt[1] + 6];
    }

    if (spec.finger) p.finger = true;
    if (mv.prop && !spec.prop) { p.prop = mv.prop; p.propAng = -0.2; }
    if (air) {
      p.hy = -76; p.footB = [-14, -30];
      if (spec.limb !== 'footF') p.footF = [20, -34];
    }
    return;
  }

  // scripted special animation keys
  const total = mv.frames || (mv.startup + mv.active + mv.recovery) || 30;
  const u = clamp(mt / total, 0, 1);
  const rel = mv.release !== undefined ? mv.release : Math.floor(total * 0.4);
  if (spec.limb === 'cast') {
    if (mt < rel) {
      const k = Ease.smooth(mt / Math.max(1, rel));
      p.lean = -0.12 * k; p.handF = [lerp(34, 4, k), lerp(-124, -118, k)]; p.handB = [lerp(14, -6, k), -110];
      p.hx = -6 * k;
    } else {
      const k = Ease.outQuad(clamp((mt - rel) / 8, 0, 1)), fade = 1 - clamp((mt - rel - 10) / (total - rel), 0, 1) * 0.6;
      p.lean = 0.18 * k * fade; p.handF = [lerp(4, 92, k), -126]; p.handB = [lerp(-6, 74, k), -118];
      p.hx = 6 * k;
    }
    p.footF = [30, 0]; p.footB = [-26, 0];
    if (mv.prop) { p.prop = mv.prop; p.propAng = 0; }
  } else if (spec.limb === 'summon') {
    const k = Ease.outCubic(clamp(mt / 14, 0, 1));
    p.handF = [lerp(34, 30, k), lerp(-124, -212, k) + Math.sin(mt * 0.6) * 3]; p.handB = [lerp(14, -6, k), lerp(-116, -206, k) + Math.cos(mt * 0.6) * 3];
    p.lean = -0.08 * k; p.glow = mv.glow || '#ffd94a';
    p.footF = [30, 0]; p.footB = [-28, 0];
  } else if (spec.limb === 'buff') {
    const sh = Math.sin(mt * 1.2) * 2;
    p.handF = [30 + sh, -128]; p.handB = [10 - sh, -120]; p.hy = -60; p.lean = 0.1; p.glow = mv.glow || '#ff8a3d';
    p.footF = [34, 0]; p.footB = [-32, 0]; p.headY = 6; p.eyes = 'angry';
  } else if (spec.limb === 'dash') {
    p.lean = 0.55; p.footF = [54, -6]; p.footB = [-46, -2]; p.handF = [-16, -108]; p.handB = [-28, -98]; p.hy = -58;
    if (mv.dashHit && mt >= (mv.dashHit[0] || 0)) { p.handF = [70, -120]; p.handB = [58, -110]; p.lean = 0.5; }
  } else if (spec.limb === 'spin') {
    p.rot = (mt / total) * TAU * (mv.spins || 1); p.rotY = -90; p.footF = [40, -60]; p.footB = [-40, -60]; p.handF = [70, -100]; p.handB = [-70, -100]; p.hy = -90;
  } else if (spec.limb === 'ground') {
    const k = Ease.smooth(clamp(mt / 10, 0, 1));
    p.hy = -71 + 49 * k; p.headY = 24 * k; p.lean = 0.3 * k; p.handF = [46, -20 * (1 - k) - 6]; p.handB = [30, -8];
    p.footF = [40, 0]; p.footB = [-32, 0];
  } else if (spec.limb === 'throw') {
    p.lean = 0.3; p.handF = [64, -100]; p.handB = [56, -96];
  }

/* ---- 21-fighter-render.js ---- */
// ===== Fighter renderer: adult proportions, shaded clothes and limbs, a detailed 3/4-view face =====
// Poses come from 20-fighter-draw.js (joints in "rig" units, feet at the origin, +x forward, -y up). The rig is painted
// BODY_S times larger; the head is drawn in its own units (about 44 tall) and scaled by HEAD_K.

const INK = '#150c2a';          // outline ink
const BODY_S = 1.1;             // on-screen scale of the rig
const HEAD_K = 0.9;             // head drawing units -> rig units
const LIGHT = [0.5, -0.85];     // key light: from the front and above

// ---------------------------------------------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------------------------------------------
// Catmull-Rom spline through points, appended to a Path2D
function addSpline(path, pts, first) {
  const n = pts.length;
  if (first) path.moveTo(pts[0][0], pts[0][1]); else path.lineTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    path.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
}
function spline(pts, closed) {
  const p = new Path2D(), n = pts.length;
  if (!closed) { addSpline(p, pts, true); return p; }
  p.moveTo(pts[0][0], pts[0][1]);

  }

  const e = p.eyes;

    ctx.moveTo(4.6, -0.2); ctx.quadraticCurveTo(8.4, 1.8, 12.4, -0.1);         // eye bag
    ctx.moveTo(3.7, -4.7); ctx.lineTo(1, -6); ctx.moveTo(3.5, -3.6); ctx.lineTo(0.6, -3.6); // crow's feet
    if (age > 0.4) { ctx.moveTo(2.4, -14.2); ctx.quadraticCurveTo(8, -15.4, 13, -14.4); ctx.moveTo(3.4, -12.2); ctx.quadraticCurveTo(8.4, -13.2, 13.4, -12.4); }
    if (age > 0.55) { ctx.moveTo(-1, 14.5); ctx.quadraticCurveTo(5, 18.2, 10.6, 17); }

}

// robot boss (the electoral threshold: a walking ballot box)

function drawRobotHead(ctx, f, look, p, C) {
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-4, -30); ctx.lineTo(-8, -44); ctx.stroke();
  ctx.beginPath(); ctx.arc(-8, -47, 5, 0, TAU); ctx.fillStyle = C('#ff4f6a'); ctx.fill(); ctx.stroke();
  const g = ctx.createLinearGradient(0, -30, 0, 30); g.addColorStop(0, C('#dfe4ef')); g.addColorStop(1, C('#8d97ab'));
  rr(ctx, -30, -28, 60, 56, 13); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  rr(ctx, -23, -16, 50, 23, 7); ctx.fillStyle = C('#12163a'); ctx.fill(); ctx.lineWidth = 2.2; ctx.stroke();
  const e = p.eyes, col = e === 'hurt' || e === 'ko' ? '#ff5a7a' : e === 'happy' ? '#7dff9a' : '#6ff0ff';
  ctx.strokeStyle = C(col); ctx.fillStyle = C(col); ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  for (const ex of [-9, 14]) {
    if (e === 'ko') { ctx.beginPath(); ctx.moveTo(ex - 4.5, -12); ctx.lineTo(ex + 4.5, -3); ctx.moveTo(ex + 4.5, -12); ctx.lineTo(ex - 4.5, -3); ctx.stroke(); }
    else if (e === 'happy') { ctx.beginPath(); ctx.arc(ex, -4, 5.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (e === 'angry') { ctx.beginPath(); ctx.moveTo(ex - 5.5, -11 + (ex < 0 ? 0 : 3.5)); ctx.lineTo(ex + 5.5, -6 - (ex < 0 ? 0 : 3.5)); ctx.lineTo(ex + 5.5, -2); ctx.lineTo(ex - 5.5, -2); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(ex, -6.5, 4.5, e === 'squint' ? 2.2 : 5.4, 0, 0, TAU); ctx.fill(); }
  }
  const open = p.mouth === 'shout' || p.mouth === 'open' || p.mouth === 'o' ? 7 : 3;
  rr(ctx, -14, 13, 40, open + 2, 3); ctx.fillStyle = C('#1b1330'); ctx.fill();
  ctx.fillStyle = C('#fff'); ctx.fillRect(-9, 14, 29, 1.8);
  ctx.fillStyle = C('#5b6478');
  for (const [rx, ry] of [[-25, -23], [25, -23], [-25, 22], [25, 22]]) { ctx.beginPath(); ctx.arc(rx, ry, 2.2, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawRobotTorso(ctx, look, C, ink, tint, tw, torsoLen) {
  const top = -torsoLen - 8, h = torsoLen + 22, w = tw * 0.95;
  const g = ctx.createLinearGradient(-w, 0, w, 0);
  g.addColorStop(0, C(darken(look.suit, 0.2))); g.addColorStop(0.5, C(lighten(look.suit, 0.14))); g.addColorStop(1, C(darken(look.suit, 0.25)));
  rr(ctx, -w, top, w * 2, h, 9); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2.6; ctx.strokeStyle = ink; ctx.stroke();
  rr(ctx, -w - 3, top - 6, w * 2 + 6, 13, 5); ctx.fillStyle = C('#eef2fb'); ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke();
  rr(ctx, -w * 0.5, top - 2, w, 4.5, 2.2); ctx.fillStyle = C('#1b1330'); ctx.fill();

function drawShoe(ctx, x, y, ang, col, colD, ink, tint, back) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(-7.4, -6.6); ctx.lineTo(1.6, -8.4); ctx.bezierCurveTo(7.4, -8, 11.4, -4.2, 16.6, -1.8); ctx.bezierCurveTo(21.4, 0.2, 22, 3.6, 19.2, 5.4);

function drawFist(ctx, x, y, ux, uy, skin, ink, tint, back) {
  const ang = Math.atan2(uy, ux);
  ctx.save(); ctx.translate(x + ux * 4.5, y + uy * 4.5); ctx.rotate(ang);

  ctx.lineWidth = 1.5; ctx.strokeStyle = ink; ctx.stroke();
  ctx.fillStyle = skin; ctx.fill();
  if (!tint) {
    ctx.strokeStyle = 'rgba(80,30,22,.5)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(1.4, -4.6); ctx.lineTo(1.4, 4.4); ctx.moveTo(-1.8, -3.8); ctx.lineTo(-1.8, 3.6); ctx.stroke();

function drawFighter(ctx, f, opt = {}) {
  const def = f.def, look = def.look;

  const headCX = shX + 2 + p.headX, headCY = shY - 30 + p.headY;
  const toW = (x, y) => [hipX + x * cl - y * sl, hipY + x * sl + y * cl];
  const skin = pal.skin;

  const drawArm = (target, back) => {
    const [sx, sy] = toW(back ? -9 : 10, -43);
    const r = ik(sx, sy, target[0], target[1], 30, 30, 1);
    tube(ctx, [[sx, sy], [r.jx, r.jy], [r.ex, r.ey]], [13.4, 11.4, 9.6], C(back ? pal.suitD : pal.suit), ink, { noHl: back });
    const cl2 = Math.hypot(r.ex - r.jx, r.ey - r.jy) || 1, ux = (r.ex - r.jx) / cl2, uy = (r.ey - r.jy) / cl2;
    if (!tint) {   // shirt cuff
      tube(ctx, [[r.ex - ux * 8, r.ey - uy * 8], [r.ex - ux * 2.5, r.ey - uy * 2.5]], [10.6, 10.2], C(back ? pal.shirtD : pal.shirt), ink, { flat: true, ow: 1.3 });
    }

    if (p.finger && !back) {

  };
  const drawLeg = (target, back) => {
    const sx = hipX + (back ? -7 : 7), sy = hipY + 3;
    const r = ik(sx, sy, target[0], target[1], 38, 38, -1);
    tube(ctx, [[sx, sy], [r.jx, r.jy], [r.ex, r.ey]], [17.4, 14.2, 10.8], C(back ? pal.pantsD : pal.pants), ink, { noHl: back });
    if (!tint) {   // trouser crease + turn-up
      const dx = r.ex - r.jx, dy = r.ey - r.jy, d = Math.hypot(dx, dy) || 1;
      ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r.jx, r.jy); ctx.lineTo(r.ex - dx / d * 3, r.ey - dy / d * 3); ctx.stroke();
      tube(ctx, [[r.ex - dx / d * 9, r.ey - dy / d * 9], [r.ex - dx / d * 2, r.ey - dy / d * 2]], [11.6, 11.2], C(back ? darken(pal.pants, 0.36) : pal.pantsD), ink, { flat: true, ow: 1.2 });
    }
    const fa = Math.atan2(r.ey - r.jy, r.ex - r.jx) - Math.PI / 2;
    drawShoe(ctx, r.ex + 1, r.ey + 1, fa * 0.8, C(pal.shoe), C(pal.shoeD), ink, tint, back);

  // aura glow

    glow(ctx, 130, p.glow, 0.55 + Math.sin(f.clock * 0.3) * 0.15); ctx.restore();
  }

  // ---- back layer
  drawArm(p.handB, true);
  drawLeg(p.footB, true);

  // ---- torso (jacket)
  ctx.save();
  ctx.translate(hipX, hipY);
  ctx.rotate(p.lean);

  else {

    torso.closePath();

    ctx.fillStyle = tg; ctx.fill(torso);
    ctx.lineWidth = 1.8; ctx.strokeStyle = ink; ctx.stroke(torso);
    if (!tint) {
      ctx.save(); ctx.clip(torso);
      const vg = ctx.createLinearGradient(0, -53, 0, 7); vg.addColorStop(0, 'rgba(255,255,255,.1)'); vg.addColorStop(0.5, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(0,0,0,.26)');
      ctx.fillStyle = vg; ctx.fillRect(-40, -56, 80, 66);
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.1;   // fabric folds
      ctx.beginPath(); ctx.moveTo(-ww + 4, -16); ctx.quadraticCurveTo(-2, -12, ww - 3, -15); ctx.moveTo(-12, -30); ctx.quadraticCurveTo(-6, -22, -8, -14); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  // ---- neck (world space, from the shoulders up to the chin)
  if (!look.robot) {
    const nx = shX + 1, ny = shY - 1, hx = headCX - 1 + Math.sin(p.headRot) * 6, hy = headCY + 14;

    ctx.beginPath(); ctx.moveTo(-3.6, -53.4); ctx.lineTo(0.4, -49); ctx.lineTo(-5.8, -47.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9.6, -53.2); ctx.lineTo(6.6, -48.6); ctx.lineTo(12.6, -47.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    // tie
    if (look.tie && !open) {
      ctx.beginPath(); ctx.moveTo(3.4, -49); ctx.lineTo(8.2, -49); ctx.lineTo(9, -31); ctx.lineTo(5.9, -25.2); ctx.lineTo(2.6, -31); ctx.closePath();
      const tg2 = ctx.createLinearGradient(2, 0, 9, 0); tg2.addColorStop(0, C(pal.tieD)); tg2.addColorStop(0.5, C(pal.tie)); tg2.addColorStop(1, C(pal.tieD));
      ctx.fillStyle = tg2; ctx.fill(); ctx.stroke();
      rr(ctx, 2.6, -53, 6.4, 5.2, 1.8); ctx.fillStyle = C(pal.tie); ctx.fill(); ctx.stroke();
    }
    // lapels
    ctx.fillStyle = C(pal.suitL); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-3.6, -53.4); ctx.lineTo(-10, -45.6); ctx.lineTo(-1.6, -31); ctx.lineTo(5.6, -25.5); ctx.lineTo(0.2, -34); ctx.lineTo(-1.4, -47.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9.6, -53.2); ctx.lineTo(16.6, -45.6); ctx.lineTo(12.4, -31); ctx.lineTo(5.6, -25.5); ctx.lineTo(9.6, -34); ctx.lineTo(10.6, -47.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    // centre line, buttons, pocket square, pin
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(5.6, -25.5); ctx.lineTo(6.2, 6); ctx.stroke();
    ctx.fillStyle = C(pal.suitDD);
    for (const by of [-19, -9]) { ctx.beginPath(); ctx.arc(7.6, by, 1.5, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.moveTo(14.4, -33.6); ctx.lineTo(20, -34.4); ctx.stroke();
    ctx.fillStyle = C(look.tie || '#ffffff'); ctx.beginPath(); ctx.moveTo(14.8, -34); ctx.lineTo(17, -37.4); ctx.lineTo(19.4, -34.6); ctx.closePath(); ctx.fill();
    if (look.pin) { ctx.beginPath(); ctx.arc(14, -41.4, 2.2, 0, TAU); ctx.fillStyle = C(look.pin); ctx.fill(); ctx.lineWidth = 0.9; ctx.stroke(); }
    ctx.restore();
  }

  drawLeg(p.footF, false);

  // ---- head
  ctx.save();
  ctx.translate(headCX, headCY);
  ctx.rotate(p.headRot);
  ctx.scale(HEAD_K, HEAD_K);
  if (look.robot) drawRobotHead(ctx, f, look, p, C); else drawHead(ctx, f, look, p, C);
  ctx.restore();

  // ---- front arm (+ prop)
  const armR = drawArm(p.handF, false);
  if (p.prop && !tint) drawProp(ctx, p.prop, armR.hx, armR.hy, p.propAng);

  // dizzy stars
  if (p.dizzy && !tint) {
    for (let i = 0; i < 3; i++) {
      const a = f.clock * 0.12 + (i * TAU) / 3;
      const sx = headCX + Math.cos(a) * 24, sy = headCY - 30 + Math.sin(a) * 6;
      star(ctx, sx, sy, 5, 5.5, 2.4, a); ctx.fillStyle = '#ffe14a'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
    }
  }
  ctx.restore();
}

// round portrait of a fighter's head + shoulders (HUD, select cards, VS screen)
// ---------------------------------------------------------------------------------------------------------------
const PORT_CACHE = new Map();
function drawBust(ctx, look, C) {
  const g = geo(look), pal = g.pal;
  // neck
  ctx.beginPath(); ctx.moveTo(-9, 12); ctx.lineTo(-8.5, 26); ctx.lineTo(12, 26); ctx.lineTo(9, 12); ctx.closePath();
  ctx.fillStyle = C(pal.skinD); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
  // jacket
  ctx.beginPath(); ctx.moveTo(-9, 22); ctx.bezierCurveTo(-24, 24, -42, 28, -48, 60); ctx.lineTo(52, 60); ctx.bezierCurveTo(46, 28, 28, 24, 12, 22); ctx.closePath();
  const tg = ctx.createLinearGradient(-48, 0, 52, 0); tg.addColorStop(0, C(pal.suitD)); tg.addColorStop(0.5, C(pal.suit)); tg.addColorStop(1, C(pal.suitD));
  ctx.fillStyle = tg; ctx.fill(); ctx.lineWidth = 1.8; ctx.strokeStyle = INK; ctx.stroke();
  // shirt + tie + lapels
  ctx.beginPath(); ctx.moveTo(-9, 22); ctx.lineTo(12, 22); ctx.lineTo(1.6, 54); ctx.closePath(); ctx.fillStyle = C(pal.shirt); ctx.fill(); ctx.lineWidth = 1.3; ctx.stroke();
  if (look.open) { ctx.beginPath(); ctx.moveTo(-6, 22); ctx.lineTo(9, 22); ctx.lineTo(1.6, 40); ctx.closePath(); ctx.fillStyle = C(pal.skin); ctx.fill(); }
  else if (look.tie) {
    ctx.beginPath(); ctx.moveTo(-1.4, 25); ctx.lineTo(4.8, 25); ctx.lineTo(6.8, 42); ctx.lineTo(1.6, 54); ctx.lineTo(-3.4, 42); ctx.closePath(); ctx.fillStyle = C(pal.tie); ctx.fill(); ctx.stroke();
    rr(ctx, -2.4, 21.6, 8, 5.4, 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = C(pal.suitL);
  ctx.beginPath(); ctx.moveTo(-9, 22); ctx.lineTo(-22, 33); ctx.lineTo(-10, 50); ctx.lineTo(1.6, 54); ctx.lineTo(-6, 38); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, 22); ctx.lineTo(25, 33); ctx.lineTo(13, 50); ctx.lineTo(1.6, 54); ctx.lineTo(9, 38); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (look.pin) { ctx.beginPath(); ctx.arc(21, 40, 2.6, 0, TAU); ctx.fillStyle = C(look.pin); ctx.fill(); ctx.lineWidth = 1; ctx.stroke(); }
}

function drawPortrait(ctx, def, cx, cy, r, opt = {}) {
  const t = ctx.getTransform ? ctx.getTransform() : null;
  const sc = t ? Math.max(1, Math.hypot(t.a, t.b)) : 1;
  if (opt.cache) {
    const key = [def.id, Math.round(r * sc), opt.eyes, opt.mouth, opt.flip ? 1 : 0, opt.zoom || 1, opt.bg, opt.ring, opt.lw].join('|');
    let c = PORT_CACHE.get(key);
    if (!c) {
      const pad = Math.ceil((opt.lw || 4) / 2 + 2), size = Math.ceil((r + pad) * 2 * sc);
      c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.scale(sc, sc);
      drawPortrait(x, def, r + pad, r + pad, r, Object.assign({}, opt, { cache: false }));
      c._pad = pad;
      if (PORT_CACHE.size > 80) PORT_CACHE.clear();
      PORT_CACHE.set(key, c);
    }
    ctx.drawImage(c, cx - r - c._pad, cy - r - c._pad, (r + c._pad) * 2, (r + c._pad) * 2);
    return;
  }
  const look = def.look;
  const dummy = { def, x: 0, y: 0, face: 1, st: opt.st || 'idle', t: 0, clock: opt.clock || 0, mv: null, mt: 0, vy: 0, grounded: true, walkPh: 0, moveDir: 0, hurtPct: 1, lookDir: 0.4 };
  const p = newPose();
  p.eyes = opt.eyes || 'open'; p.mouth = opt.mouth || 'smile';
  dummy.pose = p;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  if (opt.bg) {
    const bg = ctx.createRadialGradient(cx, cy - r * 0.4, r * 0.1, cx, cy, r * 1.15);
    bg.addColorStop(0, flashMix(opt.bg, 0.16)); bg.addColorStop(1, opt.bg);
    ctx.fillStyle = bg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  const k = r / 33 * (opt.zoom || 1);
  ctx.translate(cx, cy + 0.6 * k);
  ctx.scale(k * (opt.flip ? -1 : 1), k);
  ctx.translate(-2, 0);
  const C = (c) => c;
  if (look.robot) {
    ctx.translate(0, 6); ctx.scale(0.62, 0.62); drawRobotHead(ctx, dummy, look, p, C);
  } else {
    drawBust(ctx, look, C);
    drawHead(ctx, dummy, look, p, C);
  }
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.lineWidth = opt.lw || 4; ctx.strokeStyle = opt.ring || OUT; ctx.stroke();
  ctx.restore();
}

// ===== Visual effects: particles, hit bursts, floating text, screen shake =====
const COMIC = ['!בום', '!פאו', '!טראח', '!צלף', '!חבטה', '!פאף', '!ווםם', '!קראק'];

const Fx = {
  parts: [], texts: [], bursts: [], rings: [], lines: [],
  shakeAmt: 0, flashA: 0, flashCol: '#ffffff', punch: 0, calm: false,

  reset() {
    this.parts.length = 0; this.texts.length = 0; this.bursts.length = 0; this.rings.length = 0; this.lines.length = 0;
    this.shakeAmt = 0; this.flashA = 0; this.punch = 0;
  },

  add(p) {
    if (this.parts.length > 700) this.parts.shift();
    p.max = p.life;
    this.parts.push(p);
  },

  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, this.calm ? a * 0.3 : a); },
  flash(col, a) { this.flashCol = col; this.flashA = Math.max(this.flashA, this.calm ? a * 0.35 : a); },

  sparks(x, y, n, col, spd = 7, life = 18) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), s = rnd(spd * 0.4, spd);
      this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0.18, drag: 0.94, life: life * rnd(0.6, 1.2), size: rnd(2, 4), color: col, shape: 'spark' });
    }
  },
  stars(x, y, n, col, spd = 5) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), s = rnd(spd * 0.3, spd);
      this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g: 0.22, drag: 0.95, life: rnd(22, 40), size: rnd(5, 9), color: col, shape: 'star', rot: rnd(TAU), vr: rnd(-0.3, 0.3) });
    }
  },
  paper(x, y, n, dir = 1) {
    for (let i = 0; i < n; i++) {
      this.add({ x, y, vx: dir * rnd(1, 7) + rnd(-2, 2), vy: rnd(-7, -1), g: 0.16, drag: 0.97, life: rnd(40, 75), size: rnd(6, 11), color: pick(['#ffffff', '#f4f1e6', '#dde6f5']), shape: 'paper', rot: rnd(TAU), vr: rnd(-0.3, 0.3) });
    }
  },
  dust(x, y, dir = 0, n = 6) {
    for (let i = 0; i < n; i++) {
      this.add({ x: x + rnd(-10, 10), y: y - rnd(0, 4), vx: dir * rnd(0.5, 2.5) + rnd(-1, 1), vy: rnd(-1.4, -0.2), g: -0.01, drag: 0.94, life: rnd(16, 28), size: rnd(6, 12), color: '#d9d2e6', shape: 'smoke', size1: 2 });
    }
  },
  coins(x, y, n, dir = 1) {
    for (let i = 0; i < n; i++) {
      this.add({ x, y, vx: dir * rnd(1, 6) + rnd(-2, 2), vy: rnd(-9, -3), g: 0.4, drag: 0.99, life: rnd(40, 70), size: rnd(7, 10), color: '#ffd23d', shape: 'coin', rot: rnd(TAU), vr: 0.3 });
    }
  },
  confetti(x, y, n, spread = 8) {
    const cols = ['#ff5a7a', '#ffd23d', '#5ad7ff', '#8bff7a', '#c07aff', '#ffffff'];
    for (let i = 0; i < n; i++) {
      this.add({ x, y, vx: rnd(-spread, spread), vy: rnd(-12, -3), g: 0.24, drag: 0.98, life: rnd(60, 120), size: rnd(5, 9), color: pick(cols), shape: 'paper', rot: rnd(TAU), vr: rnd(-0.35, 0.35) });
    }
  },
  feathers(x, y, n) {
    for (let i = 0; i < n; i++) {
      this.add({ x: x + rnd(-20, 20), y: y + rnd(-20, 20), vx: rnd(-3, 3), vy: rnd(-3, 1), g: 0.03, drag: 0.97, life: rnd(40, 80), size: rnd(6, 9), color: '#ffffff', shape: 'feather', rot: rnd(TAU), vr: rnd(-0.2, 0.2) });
    }
  },
  glowDots(x, y, n, col, spd = 4) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), s = rnd(0.5, spd);
      this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g: -0.03, drag: 0.96, life: rnd(20, 40), size: rnd(4, 9), color: col, shape: 'glow' });
    }
  },

  burst(x, y, o = {}) {
    this.bursts.push({ x, y, t: 0, max: o.life || 12, r: o.r || 50, col: o.col || '#fff', col2: o.col2 || '#ffe14a', rot: o.rot === undefined ? rnd(TAU) : o.rot, spikes: o.spikes || 9 });
  },
  ring(x, y, r0, r1, col, life = 16, lw = 6) {
    this.rings.push({ x, y, r0, r1, col, t: 0, max: life, lw });
  },
  text(x, y, str, o = {}) {
    this.texts.push({ x, y, str, t: 0, max: o.life || 46, vy: o.vy === undefined ? -1.1 : o.vy, size: o.size || 26, col: o.col || '#fff', stroke: o.stroke || '#1b1330', rot: o.rot || 0, pop: o.pop === undefined ? 1 : o.pop, font: o.font || 'disp' });
  },
  comic(x, y, col) {
    this.text(x + rnd(-20, 20), y - 30, pick(COMIC), { size: rnd(26, 34), col: col || '#ffe14a', rot: rnd(-0.3, 0.3), life: 30, vy: -0.6 });
  },
  speedLines(x, y, dir, n = 6) {
    for (let i = 0; i < n; i++) this.lines.push({ x: x - dir * rnd(0, 60), y: y + rnd(-90, 30), len: rnd(50, 130), dir, t: 0, max: 10 });
  },

  update() {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.vx *= p.drag; p.vy = (p.vy + p.g) * p.drag;
      p.x += p.vx; p.y += p.vy;
      if (p.vr) p.rot += p.vr;
      if (p.shape === 'paper' || p.shape === 'feather') p.vx += Math.sin(p.life * 0.3) * 0.12;
      if (p.shape === 'coin' && p.y > GROUND && p.vy > 0) { p.y = GROUND; p.vy *= -0.5; }
      if (--p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.t++; t.y += t.vy; if (t.t >= t.max) this.texts.splice(i, 1); }
    for (let i = this.bursts.length - 1; i >= 0; i--) { const b = this.bursts[i]; if (++b.t >= b.max) this.bursts.splice(i, 1); }
    for (let i = this.rings.length - 1; i >= 0; i--) { const r = this.rings[i]; if (++r.t >= r.max) this.rings.splice(i, 1); }
    for (let i = this.lines.length - 1; i >= 0; i--) { const l = this.lines[i]; if (++l.t >= l.max) this.lines.splice(i, 1); }
    this.shakeAmt *= 0.86; if (this.shakeAmt < 0.15) this.shakeAmt = 0;
    this.flashA *= 0.84; if (this.flashA < 0.01) this.flashA = 0;
    this.punch *= 0.85;
  },

  draw(ctx) {
    for (const r of this.rings) {
      const k = r.t / r.max;
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.lineWidth = r.lw * (1 - k * 0.7);
      ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, Ease.outCubic(k)), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const l of this.lines) {
      const k = l.t / l.max;
      ctx.globalAlpha = (1 - k) * 0.7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.dir * l.len * (0.4 + k), l.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const b of this.bursts) {
      const k = b.t / b.max, r = b.r * (0.35 + Ease.outCubic(k) * 0.9);
      // impact flash: an additive bloom, thin cracks of light and a hot core (no cartoon starburst)
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.globalCompositeOperation = 'lighter'; glow(ctx, r * 1.35, b.col2, (1 - k) * 0.85);
      ctx.globalCompositeOperation = 'source-over';
      ctx.rotate(b.rot); ctx.globalAlpha = 1 - k * k;
      star(ctx, 0, 0, b.spikes, r * 0.95, r * 0.13); ctx.fillStyle = b.col; ctx.fill();
      star(ctx, 0, 0, b.spikes, r * 0.55, r * 0.2); ctx.fillStyle = b.col2; ctx.globalAlpha = (1 - k) * 0.8; ctx.fill();
      ctx.globalAlpha = (1 - k * k); ctx.beginPath(); ctx.arc(0, 0, r * 0.2 * (1 - k * 0.6), 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    for (const p of this.parts) {
      const k = p.life / p.max;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      if (p.shape === 'spark') {
        ctx.strokeStyle = p.color; ctx.lineWidth = p.size * k + 0.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6); ctx.stroke();
      } else if (p.shape === 'star') {
        star(ctx, p.x, p.y, 5, p.size * (0.4 + k * 0.6), p.size * 0.4 * (0.4 + k * 0.6), p.rot);
        ctx.fillStyle = p.color; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      } else if (p.shape === 'paper') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.3)) * 0.8 + 0.2);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); ctx.restore();
      } else if (p.shape === 'coin') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(Math.abs(Math.cos(p.rot)) * 0.8 + 0.2, 1);
        ctx.beginPath(); ctx.arc(0, 0, p.size, 0, TAU); ctx.fillStyle = p.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#a87500'; ctx.stroke(); ctx.restore();
      } else if (p.shape === 'smoke') {
        const s = lerp(p.size, p.size * 2.4, 1 - k);
        ctx.globalAlpha = k * 0.55; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
      } else if (p.shape === 'feather') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.35, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#c9d4e6'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
      } else if (p.shape === 'glow') {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(p.x, p.y); glow(ctx, p.size * 2.5 * k + 2, p.color, 0.9); ctx.restore();
      } else {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const t of this.texts) {

        c.fillStyle = '#0d1a33'; c.fillRect(cx + 92, 308, 46, 26);
        // chair
        const chg = c.createLinearGradient(cx + 140, 0, cx + 210, 0); chg.addColorStop(0, '#5a1524'); chg.addColorStop(0.5, '#9a2a40'); chg.addColorStop(1, '#4a101c');
        c.fillStyle = chg; rr(c, cx + 150, 270, 64, 96, 24); c.fill(); c.strokeStyle = '#2a0a12'; c.lineWidth = 2; c.stroke();
        // chandelier
        c.strokeStyle = '#d4a94a'; c.lineWidth = 3; c.beginPath(); c.moveTo(cx, 0); c.lineTo(cx, 56); c.stroke();
        c.beginPath(); c.arc(cx, 66, 42, 0.05, Math.PI - 0.05); c.stroke();
        for (let i = -3; i <= 3; i++) { const yy = 66 + Math.sqrt(Math.max(0, 1764 - i * i * 190)) * 0.92; radial(c, cx + i * 13.5, yy, 26, '#ffe6a0', 0.7); c.fillStyle = '#fff6d8'; c.beginPath(); c.arc(cx + i * 13.5, yy, 3.6, 0, TAU); c.fill(); }
        radial(c, cx, 96, 170, '#ffe9a8', 0.4);
        grain(c, w, h, 0.05);
      } },
      { f: 1, draw(c, w, h) {
        vgrad(c, 0, GROUND - 8, w, h - GROUND + 8, [[0, '#851c30'], [0.4, '#5c1222'], [1, '#2c0810']]);
        c.fillStyle = '#d4a94a'; c.fillRect(0, GROUND - 8, w, 4); c.fillStyle = '#6f5220'; c.fillRect(0, GROUND - 4, w, 2);
        c.strokeStyle = 'rgba(226,184,74,.32)'; c.lineWidth = 2.5;
        for (let x = -100; x < w + 100; x += 92) { c.beginPath(); c.moveTo(x, GROUND); c.lineTo(x + 46, GROUND + 40); c.lineTo(x, GROUND + 80); c.lineTo(x - 46, GROUND + 40); c.closePath(); c.stroke(); }
        radial(c, w / 2, GROUND + 40, 420, '#ffd58a', 0.16);
        vgrad(c, 0, 0, w, 40, [[0, 'rgba(0,0,0,.5)'], [1, 'rgba(0,0,0,0)']]);
        grain(c, w, h, 0.06);
      } },
    ],
    dyn(ctx, t, cx) {
      for (let i = 0; i < 18; i++) {
        const seed = i * 41.7;
        const x = cx - 480 + ((seed * 9.1 + t * 0.25) % 960), y = 60 + ((seed * 5.3 + Math.sin(t * 0.01 + i) * 30) % 380);
        ctx.fillStyle = `rgba(255,240,200,${0.14 + 0.14 * Math.sin(t * 0.05 + i)})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
      }
    },
  },
];

const Stages = {
  lx(f, cx) { return -(W / 2) * (1 - f) + cx * (1 - f); },
  res: 1.25, cache: new Map(), vig: null,
  order: [],
  setRes(r) { r = clamp(Math.round(r * 4) / 4, 1, 1.5); if (r !== this.res) { this.res = r; this.cache.clear(); this.order = []; this.vig = null; } },
  layerCanvas(stage, idx) {
    const key = stage.id + ':' + idx;
    let cv = this.cache.get(key);
    if (cv) return cv;
    // keep the bitmaps of at most two stages in memory (phones)
    if (!this.order.includes(stage.id)) {
      this.order.push(stage.id);
      while (this.order.length > 2) { const old = this.order.shift(); for (const k of Array.from(this.cache.keys())) if (k.startsWith(old + ':')) this.cache.delete(k); }
    }
    const L = stage.layers[idx];
    const w = Math.ceil(W + (STAGE_W - W) * L.f), h = H;
    cv = document.createElement('canvas');
    cv.width = Math.ceil(w * this.res); cv.height = Math.ceil(h * this.res);
    const c = cv.getContext('2d');
    c.scale(this.res, this.res);
    c.lineJoin = 'round';
    L.draw(c, w, h);
    // depth of field: soften the far layers once, at cache time
    if (L.blur && 'filter' in c) {
      const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height;
      const tc = t.getContext('2d'); tc.filter = `blur(${(L.blur * this.res).toFixed(2)}px)`; tc.drawImage(cv, 0, 0);
      cv = t;
    }
    this.cache.set(key, cv);
    return cv;
  },
  draw(ctx, stage, cx, t, part) {
    if (part === 'back') {
      stage.layers.forEach((L, i) => {
        const cv = this.layerCanvas(stage, i);
        const x0 = -(W / 2) * (1 - L.f) + cx * (1 - L.f);
        ctx.drawImage(cv, x0, 0, cv.width / this.res, cv.height / this.res);
      });
      if (stage.dyn) stage.dyn(ctx, t, cx);
    } else if (stage.front) stage.front(ctx, t, cx);
  },
  vignette(ctx) {
    if (!this.vig) {
      const cv = document.createElement('canvas'); cv.width = 240; cv.height = 135;
      const c = cv.getContext('2d');
      const g = c.createRadialGradient(120, 68, 34, 120, 68, 150);
      g.addColorStop(0, 'rgba(8,4,24,0)'); g.addColorStop(0.7, 'rgba(8,4,24,.28)'); g.addColorStop(1, 'rgba(8,4,24,.68)');
      c.fillStyle = g; c.fillRect(0, 0, 240, 135);
      this.vig = cv;
    }
    ctx.drawImage(this.vig, 0, 0, W, H);
  },
  prewarm(stage) { stage.layers.forEach((_, i) => this.layerCanvas(stage, i)); },
};

/* ---- 60-audio.js ---- */
// ===== Audio: fully synthesised SFX + a small step-sequenced soundtrack (no audio files) =====
const Snd = {
  ctx: null, master: null, sfxG: null, musG: null, noiseBuf: null,
  vol: { sfx: 0.8, music: 0.5 }, muted: false, quiet: false,
  music: { name: null, step: 0, nextT: 0, timer: 0, track: null },
  last: {},

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.85;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 5;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = this.vol.sfx; this.sfxG.connect(this.master);
      this.musG = this.ctx.createGain(); this.musG.gain.value = this.vol.music * 0.5; this.musG.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },

  resume() { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { /* ignore */ } },

  setVol(kind, v) {
    this.vol[kind] = v;
    if (!this.ctx) return;
    if (kind === 'sfx') this.sfxG.gain.value = v;
    else this.musG.gain.value = v * 0.5;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.85;
  },

  // ---- primitives ----
  tone(freq, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + dur);
    const v = (o.vol === undefined ? 0.25 : o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    let out = g;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); out = f; }
    out.connect(o.dest || this.sfxG);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },

  noise(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const g = c.createGain();
    const v = (o.vol === undefined ? 0.3 : o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const f = c.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 1500, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    f.Q.value = o.q || 0.9;
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfxG);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  },

  // ---- SFX ----
  play(name, o) {
    if (!this.ctx || this.muted) return;
    if (this.quiet && !UI_SOUNDS.has(name)) return;
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < 35) return;
    this.last[name] = now;
    const fn = SFX[name];
    if (fn) { try { fn(this, o || {}); } catch (e) { /* audio must never break the game */ } }
  },

  // ---- Music ----
  playMusic(name) {
    if (!this.ctx) { this.music.pending = name; return; }
    if (this.music.name === name) return;
    this.stopMusic();
    const tr = TRACKS[name];
    if (!tr) return;
    const m = this.music;
    m.name = name; m.track = tr; m.step = 0; m.nextT = this.ctx.currentTime + 0.08;
    m.timer = setInterval(() => this.pump(), 30);
  },
  stopMusic() {
    const m = this.music;
    if (m.timer) clearInterval(m.timer);
    m.timer = 0; m.name = null; m.pending = null;
  },
  pump() {
    const c = this.ctx, m = this.music, tr = m.track;
    if (!c || !tr) return;
    if (c.state !== 'running') { m.nextT = c.currentTime + 0.1; return; }
    const sd = 60 / tr.bpm / 4;
    while (m.nextT < c.currentTime + 0.14) {
      tr.step(this, m.step, m.nextT, sd);
      m.nextT += sd; m.step++;
    }
  },

  // instruments (absolute time scheduling)
  kick(t, v = 0.7) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(this.musG); o.start(t); o.stop(t + 0.22);
  },
  snare(t, v = 0.35) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7;
    const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    s.connect(f); f.connect(g); g.connect(this.musG); s.start(t, Math.random() * 0.5); s.stop(t + 0.2);
    const o = c.createOscillator(), og = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.08);
    og.gain.setValueAtTime(v * 0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.1); o.connect(og); og.connect(this.musG); o.start(t); o.stop(t + 0.12);
  },
  hat(t, v = 0.12, open = false) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
    const g = c.createGain(); const d = open ? 0.16 : 0.04;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(f); f.connect(g); g.connect(this.musG); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
  },
  note(t, freq, dur, o = {}) {
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    osc.type = o.type || 'sawtooth'; osc.frequency.setValueAtTime(freq, t);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 5.5; lg.gain.value = freq * 0.012; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
    f.type = 'lowpass'; f.frequency.setValueAtTime(o.lp || 1200, t); if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + dur);
    const v = o.vol || 0.15;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(f); f.connect(g); g.connect(this.musG); osc.start(t); osc.stop(t + dur + 0.05);
  },
};

const UI_SOUNDS = new Set(['move', 'select', 'confirm', 'back', 'toast', 'tick', 'win', 'lose', 'round']);
const hz = (semi) => 440 * Math.pow(2, (semi - 9) / 12);   // semitones above C4 -> Hz

// ---- SFX recipes ----

  superStart(s) { s.tone(120, 0.7, { type: 'sawtooth', slide: 1400, vol: 0.28, lp: 3000 }); s.noise(0.7, { f0: 300, f1: 5000, vol: 0.3 }); s.tone(60, 0.6, { type: 'sine', vol: 0.5 }); },

  round(s) { [0, 4, 7].forEach((n, i) => s.tone(hz(2 + n), 0.22, { type: 'square', vol: 0.15, delay: i * 0.09 })); },

// ---- Soundtrack: Phrygian-dominant ("freygish") flavour, 16th-note step sequencer ----
const PD = [0, 1, 4, 5, 7, 8, 10];   // scale degrees in semitones
const TRACKS = {
  battle: {
    bpm: 140,
    bass: [0, -1, 0, 0, 0, -1, 12, 0, 0, -1, 0, 0, 1, -1, 0, 4,   0, -1, 0, 0, 0, -1, 12, 0, 8, -1, 7, -1, 5, -1, 4, 1],
    lead: [
      [12, -1, 16, -1, 19, -1, 16, -1, 12, -1, 16, -1, 20, -1, 19, -1],
      [12, -1, 16, -1, 19, -1, 16, -1, 13, -1, 16, -1, 19, -1, 20, 19],
      [24, -1, 22, 20, 19, -1, 16, -1, 20, -1, 19, 16, 13, -1, 12, -1],
      [12, 13, 16, 13, 12, -1, 19, -1, 20, 19, 16, 13, 12, -1, -1, -1],
    ],
    step(s, i, t, sd) {
      const k = i % 16, bar = Math.floor(i / 16) % 4;
      if (k % 4 === 0) s.kick(t, 0.75);
      if (k === 10) s.kick(t, 0.5);
      if (k === 4 || k === 12) s.snare(t, 0.3);
      if (k % 2 === 0) s.hat(t, k % 4 === 2 ? 0.14 : 0.08, k === 14);
      const b = this.bass[(i % 32)];
      if (b !== -1 && (k % 2 === 0 || b !== 0)) s.note(t, hz(-22 + b), sd * 1.8, { type: 'sawtooth', vol: 0.32, lp: 500, lp2: 200 });
      if (bar >= 0) {
        const l = this.lead[bar][k];
        if (l !== -1) s.note(t, hz(2 + l), sd * 1.7, { type: 'square', vol: 0.09, lp: 3200, vib: true });
      }
    },
  },
  menu: {
    bpm: 96,
    arp: [0, 4, 7, 4, 1, 4, 8, 4, 0, 4, 7, 12, 10, 7, 4, 1],
    step(s, i, t, sd) {
      const k = i % 16, bar = Math.floor(i / 16) % 4;
      if (k === 0 || k === 8) s.kick(t, 0.5);
      if (k === 4 || k === 12) s.snare(t, 0.16);
      if (k % 2 === 0) s.hat(t, 0.06);
      const root = [0, 0, 1, 0][bar];
      if (k % 4 === 0) s.note(t, hz(-22 + root), sd * 3.5, { type: 'sine', vol: 0.5, lp: 400 });
      const a = this.arp[k] + root;
      s.note(t, hz(14 + a), sd * 2.2, { type: 'triangle', vol: 0.14, lp: 2400, lp2: 900 });
      if (k === 0) { s.note(t, hz(2 + root), sd * 14, { type: 'sawtooth', vol: 0.05, lp: 700, attack: 0.3 }); s.note(t, hz(9 + root), sd * 14, { type: 'sawtooth', vol: 0.04, lp: 700, attack: 0.4 }); }
    },
  },
  victory: {
    bpm: 128,
    step(s, i, t, sd) {
      const k = i % 16;
      if (k % 4 === 0) s.kick(t, 0.6);
      if (k % 2 === 0) s.hat(t, 0.08);
      const m = [12, -1, 16, -1, 19, -1, 24, -1, 22, -1, 19, -1, 16, -1, 12, -1][k];
      if (m !== -1) s.note(t, hz(2 + m), sd * 1.6, { type: 'square', vol: 0.1, lp: 3000, vib: true });
    },
  },
};

// ===== Input: keyboard + gamepad + touch, unified into per-player bitmasks =====
const IN = { L: 1, R: 2, U: 4, D: 8, A: 16, B: 32, C: 64, E: 128, K: 256, S: 512, G: 1024 };
// A light  B heavy  C special-1  E special-2  K block  S super  G grab

const KEYMAPS = {
  // Single player: everything is accepted, so any comfortable layout works.
  solo: {
    KeyA: IN.L, KeyD: IN.R, KeyW: IN.U, KeyS: IN.D, ArrowLeft: IN.L, ArrowRight: IN.R, ArrowUp: IN.U, ArrowDown: IN.D,
    KeyJ: IN.A, KeyZ: IN.A, KeyF: IN.A,
    KeyK: IN.B, KeyX: IN.B, KeyG: IN.B,
    KeyL: IN.C, KeyC: IN.C, KeyH: IN.C,
    KeyU: IN.E, KeyV: IN.E, KeyR: IN.E,
    KeyI: IN.K, Space: IN.K, KeyT: IN.K, ShiftLeft: IN.K,
    KeyO: IN.S, KeyB: IN.S, KeyY: IN.S,
    KeyE: IN.G, KeyN: IN.G,
  },
  p1: {
    KeyA: IN.L, KeyD: IN.R, KeyW: IN.U, KeyS: IN.D,
    KeyF: IN.A, KeyG: IN.B, KeyH: IN.C, KeyR: IN.E, KeyT: IN.K, KeyY: IN.S, KeyE: IN.G,
  },
  p2: {
    ArrowLeft: IN.L, ArrowRight: IN.R, ArrowUp: IN.U, ArrowDown: IN.D,
    Comma: IN.A, Numpad1: IN.A, Period: IN.B, Numpad2: IN.B, Slash: IN.C, Numpad3: IN.C,
    Semicolon: IN.E, Numpad5: IN.E, Quote: IN.K, Numpad0: IN.K, Enter: IN.S, NumpadEnter: IN.S, KeyM: IN.G, Numpad4: IN.G,
  },
};

const Inp = {
  keys: new Set(),
  touch: 0,
  solo: true,            // one human -> P1 accepts every key layout
  capture: false,        // true while a fight is on screen: swallow game keys
  padPrev: [],
  anyKey: null,

  init() {
    window.addEventListener('keydown', (e) => {
      if (e.repeat && this.capture) { if (this.isGameKey(e.code)) e.preventDefault(); return; }
      this.keys.add(e.code);
      if (this.capture && this.isGameKey(e.code)) e.preventDefault();
      if (this.anyKey) this.anyKey(e);
    });
    window.addEventListener('keyup', (e) => { this.keys.delete(e.code); });
    window.addEventListener('blur', () => { this.keys.clear(); this.touch = 0; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { this.keys.clear(); this.touch = 0; } });
  },

  isGameKey(code) {
    return code in KEYMAPS.solo || code in KEYMAPS.p2;
  },

  touchSet(bit, on) { this.touch = on ? (this.touch | bit) : (this.touch & ~bit); },

  pads() {
    const list = [];
    try {
      const gp = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of gp) if (p && p.connected) list.push(p);
    } catch (e) { /* ignore */ }
    return list;
  },

  padMask(p) {
    let m = 0;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = p.buttons;
    const on = (i) => b[i] && (b[i].pressed || b[i].value > 0.5);
    if (ax < -0.45 || on(14)) m |= IN.L;
    if (ax > 0.45 || on(15)) m |= IN.R;
    if (ay < -0.55 || on(12)) m |= IN.U;
    if (ay > 0.55 || on(13)) m |= IN.D;
    if (on(2)) m |= IN.A;
    if (on(3)) m |= IN.B;
    if (on(0)) m |= IN.C;
    if (on(1)) m |= IN.E;
    if (on(4) || on(6)) m |= IN.K;
    if (on(5)) m |= IN.S;
    if (on(7)) m |= IN.G;
    return m;
  },

  read(slot) {
    let m = 0;
    const map = this.solo ? (slot === 0 ? KEYMAPS.solo : {}) : (slot === 0 ? KEYMAPS.p1 : KEYMAPS.p2);
    for (const code of this.keys) { const bit = map[code]; if (bit) m |= bit; }
    const pads = this.pads();
    if (this.solo) { if (slot === 0) for (const p of pads) m |= this.padMask(p); }
    else if (pads[slot]) m |= this.padMask(pads[slot]);
    if (slot === 0) m |= this.touch;
    // opposing directions cancel
    if ((m & IN.L) && (m & IN.R)) m &= ~(IN.L | IN.R);
    return m;
  },

  // Menu-style edge events from gamepads: returns {dx,dy,ok,back,start}
  padNav() {
    const out = { dx: 0, dy: 0, ok: false, back: false, start: false };
    const pads = this.pads();
    pads.forEach((p, i) => {
      const prev = this.padPrev[i] || {};
      const cur = { l: p.axes[0] < -0.5 || (p.buttons[14] && p.buttons[14].pressed), r: p.axes[0] > 0.5 || (p.buttons[15] && p.buttons[15].pressed),
        u: p.axes[1] < -0.5 || (p.buttons[12] && p.buttons[12].pressed), d: p.axes[1] > 0.5 || (p.buttons[13] && p.buttons[13].pressed),
        a: p.buttons[0] && p.buttons[0].pressed, b: p.buttons[1] && p.buttons[1].pressed, s: p.buttons[9] && p.buttons[9].pressed };
      if (cur.l && !prev.l) out.dx = -1;
      if (cur.r && !prev.r) out.dx = 1;
      if (cur.u && !prev.u) out.dy = -1;
      if (cur.d && !prev.d) out.dy = 1;
      if (cur.a && !prev.a) out.ok = true;
      if (cur.b && !prev.b) out.back = true;
      if (cur.s && !prev.s) out.start = true;
      this.padPrev[i] = cur;
    });
    return out;
  },
};

function M(o) {

}

const NORMAL_BASE = {

};

// spec: { L: ['שם', 'anim', {overrides}], ... }  (any key may be omitted to keep the default)
function normals(spec = {}) {
  const out = {};
  for (const k in NORMAL_BASE) {
    const base = NORMAL_BASE[k];
    const s = spec[k];
    const o = Object.assign({}, base);
    if (s) {
      if (s[0]) o.name = s[0];
      if (s[1]) o.anim = s[1];
      if (s[2]) Object.assign(o, s[2]);
    }
    o.key = k;
    out[k] = M(o);
  }
  return out;
}

// ---- specials ----
function SP(o) {
  const m = Object.assign({ kind: 'special', rank: 3, cd: 180, anim: 'cast', frames: 34, icon: 'star', ai: { min: 0, max: 900, kind: 'zone' } }, o);
  m.release = o.release !== undefined ? o.release : Math.floor(m.frames * 0.4);
  return m;
}

// Fire one or more projectiles at `release`. shots: array | (f,B)=>array.  Entries may set `at` to fire on a later frame.
function spCast(o) {
  const shots = o.shots;
  const m = SP(Object.assign({ frames: 34, release: 14 }, o));
  const fire = (f, B, list) => {
    for (const s of list) B.proj(f, Object.assign({}, s));
    if (!f.mi.cast) { f.mi.cast = true; Snd.play(o.sfx || 'cast'); }
  };
  m.tick = function (f, t, B) {
    if (typeof shots === 'function') { if (t === m.release) fire(f, B, shots(f, B)); return; }
    for (const s of shots) if (t === (s.at !== undefined ? s.at : m.release)) fire(f, B, [s]);
  };
  return m;
}

// Forward rush with a hitbox. Ends early on contact.
function spDash(o) {
  const m = SP(Object.assign({ anim: 'dash', startup: 8, dashFrames: 16, recovery: 14, vx: 10, hb: [-10, -150, 110, 150], dmg: 10, hitstun: 26, blockstun: 14, kx: 8, knockdown: true, ai: { min: 120, max: 460, kind: 'gap' } }, o));
  m.frames = m.startup + m.dashFrames + m.recovery;
  m.active = m.dashFrames;
  m.tick = function (f, t, B) {
    if (t === 0) Snd.play('dash');
    if (t >= m.startup && t < m.startup + m.dashFrames) {
      if (f.mi.dashDone) { f.vx *= 0.7; return; }
      f.vx = f.face * m.vx; f.trailOn = true;
      if (t % 3 === 0) Fx.dust(f.x, GROUND, -f.face, 1);
      const r = f.strike(m.hb, m, 'dash');
      if (r !== 'miss') { f.mi.dashDone = true; f.vx *= 0.2; f.mt = Math.max(f.mt, m.startup + m.dashFrames - 4); if (m.onDashHit) m.onDashHit(f, B, r); }
    }
  };
  return m;
}

// Self buff. apply(f,B) does the work at `release`.
function spBuff(o) {
  const m = SP(Object.assign({ anim: 'buff', frames: 34, release: 12, ai: { min: 0, max: 1000, kind: 'buff' } }, o));
  m.tick = function (f, t, B) {
    if (t === m.release) {

  };
  return m;
}
