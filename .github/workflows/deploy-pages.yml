name: Deploy Shot IQ to GitHub Pages

on:
  push:
    branches:
      - claude/basketball-shot-analyzer-bhfnjk
      - main
    paths:
      - "shot-analyzer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload shot-analyzer/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shot-analyzer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
